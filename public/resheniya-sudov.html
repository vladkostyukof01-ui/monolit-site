<script>
async function loadDecisions() {
  try {
    const res = await fetch('/api/court-decisions');
    const decisions = await res.json();
    document.getElementById('decisionsGrid').innerHTML = renderDocGrid(decisions);
  } catch (err) {
    console.error('Не удалось загрузить решения судов:', err);
  }
}
loadDecisions();
