<body>

<div id="navPlaceholder"></div>

<main>
  <div class="page-header wrap">
    <span class="eyebrow">Отзывы клиентов</span>
    <h1>Благодарности</h1>
  </div>
  <section class="section wrap" style="padding-top: 44px; border-bottom: none;">
    <div class="testimonials-grid" id="testimonialsGrid"></div>
  </section>
</main>

<div id="footerPlaceholder"></div>

<script src="/common.js"></script>
<script>
async function loadTestimonials() {
  try {
    const res = await fetch('/api/testimonials');
    const items = await res.json();
    document.getElementById('testimonialsGrid').innerHTML = renderTestimonialsGrid(items);
  } catch (err) {
    console.error('Не удалось загрузить благодарности:', err);
  }
}
loadTestimonials();
</script>
